# Ghostwire theme for tmux
# Merge into ~/.tmux.conf

set -g status-style "bg=#08090d,fg=#c8d2e6"
set -g status-left "#[bg=#9664dc,fg=#e8f7f4,bold] #S #[bg=#08090d,fg=#9664dc] "
set -g status-right "#[fg=#3a4250]%Y-%m-%d #[fg=#50dcc8,bold]%H:%M #[bg=#50dcc8,fg=#06070c,bold] #h "
set -g window-status-current-style "bg=#1c2740,fg=#50dcc8,bold"
set -g window-status-style "bg=#08090d,fg=#3a4250"
set -g pane-border-style "fg=#1a2233"
set -g pane-active-border-style "fg=#50dcc8"
set -g message-style "bg=#090c11,fg=#50dcc8"
