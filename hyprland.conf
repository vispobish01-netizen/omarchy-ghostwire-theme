# Ghostwire — Hyprland explicit border/decoration/animation overrides
# Omarchy sources this automatically from the active theme folder; for a
# manual setup add: source = ~/.config/omarchy/current/theme/hyprland.conf

general {
    col.active_border = rgba(50dcc8ee) rgba(9664dcee) 45deg
    col.inactive_border = rgba(3a425099)
    gaps_in = 4
    gaps_out = 8
    border_size = 2
}

decoration {
    rounding = 10

    active_opacity = 1.0
    inactive_opacity = 0.95

    shadow {
        enabled = true
        range = 18
        render_power = 3
        color = rgba(06070cbb)
    }

    blur {
        enabled = true
        size = 6
        passes = 2
        new_optimizations = true
        ignore_opacity = true
    }
}

animations {
    enabled = true

    bezier = ghostwireEase, 0.16, 1, 0.3, 1

    animation = windows, 1, 4, ghostwireEase, slide
    animation = windowsOut, 1, 4, ghostwireEase, slide
    animation = border, 1, 6, ghostwireEase
    animation = fade, 1, 4, ghostwireEase
    animation = workspaces, 1, 4, ghostwireEase, slide
}
