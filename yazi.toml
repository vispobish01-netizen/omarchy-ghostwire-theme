# Ghostwire theme for yazi
# Copy to ~/.config/yazi/theme.toml

[manager]
cwd = { fg = "#50dcc8" }
hovered = { fg = "#e8f7f4", bg = "#1c2740" }
preview_hovered = { underline = true }
find_keyword = { fg = "#dcb43c", bold = true }
find_position = { fg = "#9664dc", italic = true }
border_symbol = "│"
border_style = { fg = "#1a2233" }

[status]
separator_open = ""
separator_close = ""
separator_style = { fg = "#1a2233", bg = "#1a2233" }
mode_normal = { fg = "#06070c", bg = "#50dcc8", bold = true }
mode_select = { fg = "#06070c", bg = "#9664dc", bold = true }
mode_unset = { fg = "#06070c", bg = "#dc5050", bold = true }

[select]
border = { fg = "#1a2233" }
active = { fg = "#50dcc8", bold = true }
inactive = { fg = "#c8d2e6" }

[input]
border = { fg = "#50dcc8" }
title = { fg = "#e8f7f4" }
value = { fg = "#c8d2e6" }
