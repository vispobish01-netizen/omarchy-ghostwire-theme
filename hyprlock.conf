general {
    ignore_empty_input = true
    hide_cursor = true
    grace = 2
}

# ================= BACKGROUND =================
background {
    monitor =
    path = ~/.config/omarchy/current/background

    blur_passes = 4
    blur_size = 6

    noise = 0.015
    contrast = 1.1
    brightness = 0.78
}

animations {
    enabled = false
}

# ================= INVISIBLE INPUT =================
input-field {
    size = 1, 1
    position = 0, 0
    halign = center
    valign = center

    inner_color = rgba(0,0,0,0)
    outer_color = rgba(0,0,0,0)
    font_color  = rgba(0,0,0,0)

    outline_thickness = 0
    rounding = 0
    shadow_passes = 0

    fade_on_empty = false
    fail_text = <i> </i>
}

# ================= USER NAME =================
label {
    text = $USER
    color = rgba(255,255,255,0.35)
    font_size = 18
    font_family = JetBrainsMono Nerd Font

    position = 0, 150
    halign = center
    valign = center
}

# ================= QUOTE =================
label {
    text = "An endless shadow drifts through the void."
    color = rgba(255,255,255,0.22)
    font_size = 13
    font_family = JetBrainsMono Nerd Font

    position = 0, 185
    halign = center
    valign = center
}

# =====================================================
# 🔥 GLITCH SYSTEM (REAL & COMPATIBLE)
# =====================================================

# LEFT OFFSET (amber ghost)
label {
    text = cmd[update:60] echo "$(date +'%H:%M:%S')"
    color = rgba(255, 140, 0, 0.5)
    font_size = 48
    font_family = JetBrainsMono Nerd Font

    position = -3, 0
    halign = center
    valign = center
}

# RIGHT OFFSET (white flicker)
label {
    text = cmd[update:80] if [ $((RANDOM % 2)) -eq 0 ]; then echo "$(date +'%H:%M:%S')"; else echo ""; fi
    color = rgba(255,255,255,0.35)
    font_size = 48
    font_family = JetBrainsMono Nerd Font

    position = 3, 0
    halign = center
    valign = center
}

# TOP OFFSET (soft ghost)
label {
    text = cmd[update:120] echo "$(date +'%H:%M:%S')"
    color = rgba(255,255,255,0.1)
    font_size = 48
    font_family = JetBrainsMono Nerd Font

    position = 0, -2
    halign = center
    valign = center
}

# RANDOM CUT GLITCH
label {
    text = cmd[update:100] if [ $((RANDOM % 4)) -eq 0 ]; then date +"%H:%M:%S" | cut -c1-5; fi
    color = rgba(255,50,50,0.4)
    font_size = 48
    font_family = JetBrainsMono Nerd Font

    position = 0, 0
    halign = center
    valign = center
}

# HARD CORRUPTION
label {
    text = cmd[update:150] if [ $((RANDOM % 6)) -eq 0 ]; then echo "88:88:88"; fi
    color = rgba(255,255,255,0.5)
    font_size = 48
    font_family = JetBrainsMono Nerd Font

    position = 0, 0
    halign = center
    valign = center
}

# NUMBER SCRAMBLE 
label {
    text = cmd[update:90] if [ $((RANDOM % 5)) -eq 0 ]; then date +"%H:%M:%S" | sed "s/[0-9]/#/g"; fi
    color = rgba(255,120,120,0.35)
    font_size = 48
    font_family = JetBrainsMono Nerd Font

    position = 0, 0
    halign = center
    valign = center
}

# ================= MAIN CLOCK =================
label {
    text = cmd[update:1000] echo "$(date +'%H:%M:%S')"
    color = rgba(255, 250, 240, 0.95)
    font_size = 48
    font_family = JetBrainsMono Nerd Font

    position = 0, 0
    halign = center
    valign = center

    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.8)
}

# ================= AUTH =================
auth {
    fingerprint {
        enabled = true
    }
}
