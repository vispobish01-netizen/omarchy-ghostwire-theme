# Ghostwire — native Hyprlock layout (hand-tuned, not the auto-generated one)
# Copy to ~/.config/hypr/hyprlock.conf, or let Omarchy pick it up as the
# active theme's lock layout.

general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 2
    no_fade_in = false
}

background {
    monitor =
    path = ~/.config/omarchy/current/background
    blur_passes = 2
    blur_size = 5
    noise = 0.02
    contrast = 0.9
    brightness = 0.75
    vibrancy = 0.2
}

# time
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(232, 247, 244, 1.0)
    font_size = 96
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 170
    halign = center
    valign = center
}

# date
label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %B %d")"
    color = rgba(80, 220, 200, 0.9)
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    position = 0, 90
    halign = center
    valign = center
}

# ghostwire easter egg line
label {
    monitor =
    text = state: you are not here
    color = rgba(70, 80, 96, 0.8)
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    position = 0, -195
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 260, 58
    outline_thickness = 2
    dots_size = 0.26
    dots_spacing = 0.32
    dots_center = true
    outer_color = rgb(80dcc8)
    inner_color = rgb(13, 17, 23)
    font_color = rgb(200, 210, 230)
    fade_on_empty = false
    placeholder_text = <span foreground="##3a4250">password...</span>
    hide_input = false
    check_color = rgb(80, 220, 200)
    fail_color = rgb(220, 80, 80)
    fail_text = <span foreground="##dc5050">wrong pass</span>
    capslock_color = rgb(150, 100, 220)
    position = 0, -110
    halign = center
    valign = center
}
