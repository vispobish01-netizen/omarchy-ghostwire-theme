# Ghostwire — mako theme
# Omarchy auto-generates a mako config from colors.toml; this hand file adds
# per-urgency border colors and slightly larger radius/padding for the
# glass-panel look used across the rest of the theme.

background-color=#08090de6
text-color=#c8d2e6
border-color=#1a2233
progress-color=over #1c2740
border-size=1
border-radius=10
padding=10
margin=8
width=360
height=120
font=JetBrainsMono Nerd Font 11
icons=1
max-icon-size=48
default-timeout=6000
ignore-timeout=0

[urgency=low]
border-color=#3a4250
text-color=#c8d2e6

[urgency=normal]
border-color=#50dcc8
text-color=#c8d2e6

[urgency=high]
border-color=#dc5050
text-color=#e8f7f4
default-timeout=0

[category=mount]
border-color=#50c878

[category=network]
border-color=#3fc4de
